apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce-dev
data:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_ZIPKIN_BASE_URL: "http://zipkin.ecommerce-dev.svc.cluster.local:9411"
  SPRING_ZIPKIN_ENABLED: "true"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  LOGGING_LEVEL_ROOT: "INFO"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
  MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"
  EUREKA_CLIENT_REGION: "default"
  EUREKA_CLIENT_AVAILABILITYZONES_DEFAULT: "myzone"
  EUREKA_CLIENT_SERVICEURL_MYZONE: "http://service-discovery.ecommerce-dev.svc.cluster.local:8761/eureka"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery.ecommerce-dev.svc.cluster.local:8761/eureka/"
  EUREKA_CLIENT_ENABLED: "true"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  SPRING_CONFIG_IMPORT: "optional:configserver:http://cloud-config.ecommerce-dev.svc.cluster.local:9296/"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=40 -Xms128m -Xmx256m"
