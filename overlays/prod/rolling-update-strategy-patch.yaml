# Patch to optimize rolling update strategy for resource-constrained PROD cluster
# maxSurge: 0 = Don't create extra pods during update (saves CPU/memory)
# maxUnavailable: 1 = Allow 1 pod to be down during update (maintains availability)
# This prevents "Insufficient CPU" errors during deployments

apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
---
