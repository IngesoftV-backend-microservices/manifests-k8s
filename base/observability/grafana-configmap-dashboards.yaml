      "refresh": "30s",
      "schemaVersion": 27,
      "style": "dark",
      "tags": ["ecommerce", "overview", "system"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Ecommerce - Vista General del Sistema",
      "uid": "system-overview",
      "version": 1
    }
