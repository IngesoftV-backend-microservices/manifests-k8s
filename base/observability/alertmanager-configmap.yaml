apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: default
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      routes:
        - receiver: critical
          matchers:
            - severity="critical"
          repeat_interval: 30m

    receivers:
      - name: default
        webhook_configs:
          - url: http://alertmanager-webhook:8080/alerts
      - name: critical
        webhook_configs:
          - url: http://alertmanager-webhook:8080/alerts

