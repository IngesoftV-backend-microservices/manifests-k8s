apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: microservice-role
  labels:
    app.kubernetes.io/component: rbac
rules:
  # Permisos para leer ConfigMaps (configuración de la aplicación)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
    resourceNames:
      - ecommerce-config
  # Permisos para leer Secrets (credenciales, contraseñas, etc.)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Permisos para leer información de endpoints (service discovery)
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  # Permisos para leer información de servicios (service discovery)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]

